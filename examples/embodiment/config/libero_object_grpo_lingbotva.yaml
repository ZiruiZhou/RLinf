# GRPO reinforcement learning for LingBot-VA on Libero-Object.
#
# Built on top of PR #1220 (LingBot-VA SFT + eval). Starts from an SFT-trained
# transformer checkpoint (~30-50% SR on Libero-Object) and improves it with
# group-relative policy optimization.
#
# RL design (see rlinf/models/embodiment/lingbotva/RL_DESIGN.md):
#   * The policy distribution is defined ONLY over the action-denoising chain,
#     which is run as a stochastic SDE (noise_method: flow_sde). Each denoising
#     step is a diagonal Gaussian whose log-density is the action log-prob.
#     Video-latent denoising stays deterministic (world-context).
#   * GRPO (critic-free): adv_type=grpo + loss_type=actor. No value head on the
#     5B transformer; advantage is the group-normalized episode return.
#   * Mirrors the flow-matching RL already used for OpenPI / lingbotvla.
#
# STATUS: scaffolding. The model RL forwards and the stateful rollout worker
# are not yet implemented (they require the lingbot-va repo + a checkpoint).
# Do not expect this to run end-to-end yet.
#
# Required env vars (same as the eval/SFT configs):
#   LINGBOT_VA_REPO_PATH, LINGBOT_VA_MODEL_PATH,
#   LINGBOT_VA_TRANSFORMER_STATE_DICT_PATH (the SFT checkpoint to RL from).

defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/lingbotva@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Disaggregated: actor and rollout on DISJOINT GPUs so the actor->rollout
  # weight sync goes over NCCL (ring), not CUDA-IPC. Collocating them forces
  # IPC (NCCL can't do same-device send/recv), which needs pidfd_getfd — blocked
  # in containers with restricted ptrace_scope. env shares the actor GPUs (its
  # rollout-result tensors are CPU, so env<->actor transfer stays IPC-free).
  # Pair with weight_syncer.use_ring_sync=true.
  component_placement:
    actor: 0-3
    env: 0-3
    rollout: 4-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_grpo_lingbotva"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 25
  save_interval: 25

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl

  rollout_epoch: 8        # rollout epochs per training step
  eval_rollout_epoch: 1
  group_size: 8           # GRPO group size; advantage normalized within group

  # Granularity at which the chunked action tensor is reduced. token_level does
  # NOT apply to a continuous flow chain; the per-step Gaussian log-prob is
  # summed over action dims -> action_level.
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0
  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

  sampling_params:
    do_sample: True
    # SDE temperature: scales the per-step noise level. >0 enables exploration
    # on the action chain. Tune jointly with clip ratios.
    temperature_train: 1.0
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 512
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 64
    group_size: 8                     # match algorithm.group_size (grouped inits)
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reset_gripper_open: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False

  eval:
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: True
    is_eval: True
    task_id_filter: null
    init_params:
      camera_heights: 128
      camera_widths: 128
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: lingbotva
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    num_action_chunks: ${actor.model.num_action_chunks}
    action_dim: ${actor.model.action_dim}
    lingbotva:
      repo_path: ${oc.env:LINGBOT_VA_REPO_PATH}
      config_name: libero
      enable_offload: false
      action_per_frame: 4
      transformer_state_dict_path: ${oc.env:LINGBOT_VA_TRANSFORMER_STATE_DICT_PATH,null}
      save_root: ./runtime/lingbotva_rl_rollout
      # NOTE: the rollout policy is actually built from `actor.model` (see
      # huggingface_worker.init_worker), so this whole `rollout.model.lingbotva`
      # block is documentation only — the effective replay flag lives in
      # `actor.model.lingbotva.enable_kv_cache_replay`. Kept here for clarity.
      enable_kv_cache_replay: True
      # RL rollout: run the action chain as a stochastic SDE and return
      # per-step Gaussian log-probs.
      rl_mode: True
      noise_method: flow_sde
      rl_noise_level: 1.0
      # SDPA attention. flex needs torch>=2.9; gate #1 confirmed rollout vs.
      # recompute log-probs match bit-exact under attn_mode=torch.
      attn_mode: torch

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # The recompute groups a micro-batch by (frame_st_id, denoise_ind) and runs
  # each group as one batched forward, so micro_batch_size > 1 is supported and
  # recommended: set it to roughly one rollout chunk's env count so each
  # micro-batch is a single batched recompute (amortizes the FSDP all-gather and
  # the KV-cache replay). The training shuffle is disabled for lingbotva to keep
  # chunk-mates contiguous.
  micro_batch_size: 4
  # global_batch_size / (micro_batch_size * world_size) = grad_accum.
  global_batch_size: 8
  seed: 1234
  enable_offload: False

  model:
    model_type: lingbotva
    model_path: ${oc.env:LINGBOT_VA_MODEL_PATH}
    precision: bf16
    # Must equal the model's executable actions/chunk. The stateless RL rollout
    # drops the leading frame, giving (frame_chunk_size-1)*action_per_frame =
    # 3*4 = 12 for Libero. The env's per-chunk bookkeeping (prepare_actions,
    # reset terminations) uses this, so a mismatch breaks trajectory stacking.
    num_action_chunks: 12
    action_dim: 7
    add_value_head: False              # GRPO is critic-free
    lingbotva:
      repo_path: ${oc.env:LINGBOT_VA_REPO_PATH}
      config_name: libero
      enable_offload: false
      action_per_frame: 4
      transformer_state_dict_path: ${oc.env:LINGBOT_VA_TRANSFORMER_STATE_DICT_PATH,null}
      save_root: ./runtime/lingbotva_rl_actor
      # The rollout worker builds its policy from `actor.model` (huggingface_worker
      # only copies precision/model_path from `rollout.model`), so the cross-chunk
      # KV-cache replay flag the rollout needs for non-zero SR must live HERE.
      # Harmless on the actor: the recompute path doesn't touch the recorder.
      enable_kv_cache_replay: True
      # Recompute-under-replay: the rollout stores its replayed per-chunk KV
      # cache (encoded latents + actions) so the actor recompute reproduces the
      # exact conditioning the scored action step attended to (ratio~1). These
      # cap the fixed-size stored history block; must cover the episode:
      # max_history >= ceil(max_episode_steps / num_action_chunks),
      # max_frames  >= cumulative latent frames over that many chunks.
      kv_replay_max_history: 24
      kv_replay_max_frames: 80
      # Whether the ACTOR recompute replays the stored history KV cache. True =
      # exact log-prob (ratio==1) but runs a data-dependent number of FSDP
      # forwards per sample, which deadlocks DP ranks' lockstep collectives in
      # distributed training. Set False for distributed runs (recompute then does
      # a fixed 2 forwards/sample -> synced; mild history-conditioning bias in
      # the ratio). The rollout always replays (enable_kv_cache_replay) for SR.
      recompute_kv_replay: True
      # RL actor: rl_mode builds the backend and exposes its transformer as an
      # FSDP-wrapped child so the GRPO update recomputes log-probs with
      # gradients. (rl_mode supersedes training_mode; do not set both.)
      rl_mode: True
      noise_method: flow_sde
      # SDE temperature for the action-denoising step that is sampled.
      rl_noise_level: 1.0
      # SDPA attention (flex needs torch>=2.9). The actor recompute and the
      # rollout must use the SAME attn path so old/new log-probs stay consistent
      # — gate #1 verified bit-exact equality under attn_mode=torch.
      attn_mode: torch

  optim:
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    optimizer_type: adamw

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    limit_all_gathers: True
    # MUST stay False for lingbotva RL: the recompute replays a data-dependent
    # number of KV-cache forwards per sample (history grows with chunk index),
    # so resharding after each forward would make different DP ranks issue
    # different per-layer all-gathers and deadlock FSDP's lockstep collectives
    # (NCCL watchdog timeout). With reshard off, params gather once (synced on
    # the first forward) and are reused for every replay/commit/action forward.
    reshard_after_forward: False
    grad_scaler:
      enabled: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: "bf16"

reward:
  use_reward_model: False

critic:
  use_critic_model: False
