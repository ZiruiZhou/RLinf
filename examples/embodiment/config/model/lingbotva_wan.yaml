model_type: "lingbotva_wan"

# Path to the downloaded HF snapshot of robbyant/lingbot-va-posttrain-libero-long.
# Override via Hydra (actor.model.model_path=... rollout.model.model_path=...).
model_path: "/workspace/ckpts/lingbotva_libero_long"

precision: "bf16"

# LIBERO uses the first 7 of LingBot-VA's 30-D action channels (arm EEF + gripper).
action_dim: 7
# VA_Server returns frame_chunk_size (4) x action_per_frame (4) = 16 per call.
num_action_chunks: 16

# No value head / LoRA for the eval wrapper; training requires native re-impl.
add_value_head: False
value_type: action_level
is_lora: False
lora_path: null

# VA_Server constructor knobs (optional; defaults pulled from configs/va_libero_cfg.py).
enable_offload: True
frame_chunk_size: 4
action_per_frame: 4
num_inference_steps: 20
action_num_inference_steps: 50

# RLinf-specific (kept to satisfy generic validators / rollout worker).
use_proprio: False
proprio_dim: 7
max_prompt_length: 512
num_steps: 4
